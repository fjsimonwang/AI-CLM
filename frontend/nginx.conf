server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 130s;
    }

    location /actuator/ {
        proxy_pass http://backend:8080/actuator/;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # public marketing pages and their shared css/js: always revalidate,
    # so edits show up without a hard refresh
    location ~ ^/(landing|platform|capabilities|teams|governance)\.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location ~ ^/kervion\.(css|js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
